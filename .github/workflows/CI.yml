name: CI & Multi-Distro Packages

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Lint, Unit Tests & Build
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: TypeScript type check
        run: npm run lint

      - name: Run unit tests (including SIGKILL watchdog auto-restore tests)
        run: npm run test

      - name: Production Vite build
        run: npm run build

      - name: Smoke-test Linux launcher
        run: |
          node packaging/bin/airgorah-launcher.mjs --version
          node packaging/bin/airgorah-launcher.mjs --no-open --host 127.0.0.1 --port 3456 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          sleep 1
          curl -fsS http://127.0.0.1:3456/ | grep -q "Airgorah"
          curl -fsS http://127.0.0.1:3456/api/system/status | grep -q '"managedByLauncher":true'
          curl -fsSI http://127.0.0.1:3456/app_icon.png | grep -qi "image/png"

  package:
    name: Build Linux Packages (.pkg.tar.zst, .deb, .rpm, .tar.gz)
    runs-on: ubuntu-24.04
    needs: test-and-lint

    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_tag: ${{ steps.meta.outputs.release_tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve package version & release tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build packaging container image
        run: docker build . -t airgorah_packager

      - name: Build multi-distro packages and install guide
        run: |
          mkdir -p release-artifacts
          docker run --rm \
            -e RELEASE_VERSION="${{ steps.meta.outputs.version }}" \
            -e RELEASE_TAG="${{ steps.meta.outputs.release_tag }}" \
            -e GITHUB_REPOSITORY="${{ github.repository }}" \
            -v "${{ github.workspace }}:/workspace" \
            airgorah_packager

      - name: Publish multi-distro install guide to workflow summary
        run: cat release-artifacts/INSTALL.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload all packages and install instructions
        uses: actions/upload-artifact@v4
        with:
          name: airgorah-linux-packages-${{ steps.meta.outputs.version }}
          path: release-artifacts/
          if-no-files-found: error

  verify-archlinux:
    name: Verify on Arch Linux (pacman)
    runs-on: ubuntu-24.04
    needs: package
    container:
      image: archlinux:latest

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: airgorah-linux-packages-${{ needs.package.outputs.version }}
          path: release-artifacts

      - name: Validate PKGBUILD syntax
        run: bash -n release-artifacts/PKGBUILD

      - name: Install Arch Linux package via pacman and verify runtime & Wi-Fi guard
        run: |
          pacman -Syu --noconfirm --needed nodejs curl
          pacman -U --noconfirm "release-artifacts/airgorah_${{ needs.package.outputs.version }}_any.pkg.tar.zst"
          test -x /usr/bin/airgorah
          test -f /usr/share/airgorah/bin/airgorah-launcher.mjs
          test -f /usr/share/airgorah/bin/wifi-guard.mjs
          test -f /usr/share/applications/airgorah.desktop
          test -f /usr/share/polkit-1/actions/com.airgorah.pkexec.policy
          test -f /usr/share/icons/hicolor/256x256/apps/airgorah.png
          test -f /usr/lib/systemd/user/airgorah.service
          test -f /usr/lib/systemd/system/airgorah-restore.service
          airgorah --version
          /bin/airgorah --version
          airgorah --restore --quiet
          airgorah --no-open --host 127.0.0.1 --port 3456 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          sleep 1
          curl -fsS http://127.0.0.1:3456/ | grep -q "Airgorah"
          curl -fsS http://127.0.0.1:3456/api/system/status | grep -q '"isRoot":true'
          curl -fsSI http://127.0.0.1:3456/app_icon.png | grep -qi "image/png"

  verify-debian:
    name: Verify on Debian/Ubuntu (apt)
    runs-on: ubuntu-24.04
    needs: package

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: airgorah-linux-packages-${{ needs.package.outputs.version }}
          path: release-artifacts

      - name: Install .deb package and verify runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y "./release-artifacts/airgorah_${{ needs.package.outputs.version }}_all.deb"
          test -f /usr/share/polkit-1/actions/com.airgorah.pkexec.policy
          test -f /usr/lib/systemd/system/airgorah-restore.service
          airgorah --version
          airgorah --no-open --host 127.0.0.1 --port 3456 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          sleep 1
          curl -fsS http://127.0.0.1:3456/ | grep -q "Airgorah"
          curl -fsS http://127.0.0.1:3456/api/system/status | grep -q '"managedByLauncher":true'

  verify-fedora:
    name: Verify on Fedora (dnf)
    runs-on: ubuntu-24.04
    needs: package
    container:
      image: fedora:latest

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: airgorah-linux-packages-${{ needs.package.outputs.version }}
          path: release-artifacts

      - name: Install .rpm package and verify runtime
        run: |
          dnf install -y curl "./release-artifacts/airgorah_${{ needs.package.outputs.version }}_noarch.rpm"
          test -f /usr/share/polkit-1/actions/com.airgorah.pkexec.policy
          test -f /usr/lib/systemd/system/airgorah-restore.service
          airgorah --version
          airgorah --no-open --host 127.0.0.1 --port 3456 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          sleep 1
          curl -fsS http://127.0.0.1:3456/ | grep -q "Airgorah"

  release:
    name: Publish GitHub Release & Distro Instructions
    runs-on: ubuntu-24.04
    needs: [package, verify-archlinux, verify-debian, verify-fedora]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    permissions:
      contents: write

    steps:
      - name: Download verified packages
        uses: actions/download-artifact@v4
        with:
          name: airgorah-linux-packages-${{ needs.package.outputs.version }}
          path: release-artifacts

      - name: Publish GitHub Release with packages and install instructions
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.package.outputs.release_tag }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Airgorah v{0}', needs.package.outputs.version) || format('Airgorah Latest Build (v{0})', needs.package.outputs.version) }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body_path: release-artifacts/INSTALL.md
          fail_on_unmatched_files: true
          files: |
            release-artifacts/airgorah_${{ needs.package.outputs.version }}_any.pkg.tar.zst
            release-artifacts/airgorah_${{ needs.package.outputs.version }}_all.deb
            release-artifacts/airgorah_${{ needs.package.outputs.version }}_noarch.rpm
            release-artifacts/airgorah_${{ needs.package.outputs.version }}_linux_portable.tar.gz
            release-artifacts/PKGBUILD
            release-artifacts/SHA256SUMS.txt
            release-artifacts/INSTALL.md
